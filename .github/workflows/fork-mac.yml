name: Build superset++ Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node apps/desktop/node_modules/electron/install.js
      - run: bun run --cwd apps/desktop install:deps
      - run: bun run check:plugins && bun run check:i18n && bun run check:versions
      - run: bun run scripts/personal/verify-worktree-connections.ts
      - run: bun run build:mac
      - run: test -f apps/desktop/release/latest-mac.yml
      - run: bun run scripts/personal/verify-packaged-api.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superset++-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
